apiVersion: v1
kind: ConfigMap
metadata:
  name: dvwa-config
data:
  config.inc.php: |
    <?php
    $_DVWA = array();
    $_DVWA['db_server']   = 'mysql';
    $_DVWA['db_port']     = '3306';
    $_DVWA['db_user']     = 'dvwa';
    $_DVWA['db_password'] = 'dvwa';
    $_DVWA['db_database'] = 'dvwa';

    // Optional (leave empty)
    $_DVWA['recaptcha_public_key']  = '';
    $_DVWA['recaptcha_private_key'] = '';

    // Keep lab intentionally vulnerable
    $_DVWA['default_security_level'] = 'low';

    // IMPORTANT: DVWA expects this exact capitalization
    $DBMS = 'MySQL';
    ?>
